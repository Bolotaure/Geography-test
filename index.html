<style>
:root {
  --night: #140e1c;
  --night-2: #2a1830;
  --parchment: #f6ead2;
  --parchment-deep: #e7d3a4;
  --ink: #2c2118;
  --muted: #6d5c48;
  --gold: #e2b657;
  --gold-deep: #a67c2d;
  --candle: #ffd78a;
  --crimson: #8c1c2c;
  --emerald: #1f6b4a;
  --sapphire: #1e4d8c;
  --amber: #b8860b;
  --house: #8c1c2c;
  --house-ink: #fff8ea;
  --danger: #a32030;
  --found: #2f8f62;
  --sky-top: #120c18;

  --state-c: #d5e1f0;
  --state-d: #f0d4cf;
  --state-hover: #f0c36a;
  --state-found: #7dba8a;
}
:root[data-academy="verdant"] { --house: #1f6b4a; --house-ink: #f4fff8; }
:root[data-academy="azurequill"] { --house: #1e4d8c; --house-ink: #f3f7ff; }
:root[data-academy="amberkeep"] { --house: #8a5a08; --house-ink: #fff8e8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--night); color: var(--parchment); font-family: var(--font-body); overflow-x: clip; }
body {
  background:
    radial-gradient(circle at 12% 8%, #ffd78a22 0 2px, transparent 3px),
    radial-gradient(circle at 28% 18%, #fff 0 1px, transparent 2px),
    radial-gradient(circle at 70% 12%, #fff 0 1.5px, transparent 2px),
    radial-gradient(circle at 84% 22%, #ffd78a 0 1px, transparent 2px),
    radial-gradient(circle at 50% 0%, #3a2458 0, transparent 42%),

}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

[hidden] { display: none !important; }

}
.quiz-banner {

}
body.academy-home .course-head { order: -1; padding-top: .85rem; }

.game-title { font-family: var(--font-display); color: var(--candle); font-size: clamp(1.7rem, 4vw, 2.6rem); font-weight: 800; line-height: 1.15; text-shadow: 0 2px 0 #0006; }
.game-subtitle { color: #eadcc0; font-size: clamp(.95rem, 2.4vw, 1.12rem); margin-top: .2rem; }
.activity-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }

.activity-menu-wrap { position: relative; flex-shrink: 0; }

}

.prompt-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem; }

.bubble-target strong { background: var(--candle); border-radius: .45em; padding: .02em .35em; color: var(--ink); }
.mode-row { display: flex; flex-wrap: wrap; gap: .45rem; }
.mode-btn {

  padding: .35rem .9rem; font-weight: 700;
}
.mode-btn-active { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.ask-row { width: 100%; }

  display: flex; flex-direction: column; gap: .5rem; padding: .75rem;
}
.ask-quick { display: flex; flex-wrap: wrap; gap: .4rem; }

.progress-card {
  background: var(--parchment); color: var(--ink); border: 2px dashed var(--gold-deep); border-radius: 1.1rem;
  display: flex; align-items: center; gap: .75rem; padding: .45rem .8rem;
}

.map-card, .quiz-card, .shelf-card {
  background: var(--parchment); color: var(--ink); border: 3px solid #c8b48a; border-radius: 1.6rem;
  padding: clamp(.6rem, 2vw, 1.15rem); box-shadow: 0 10px 0 #0003; position: relative;
}
.map-card { overflow: hidden; }
.game-map { width: 100%; height: auto; display: block; touch-action: pan-x pan-y; }
.game-map.zoomed { touch-action: none; cursor: grab; }
.zoom-controls { position: static; z-index: 2; display: flex; justify-content: flex-end; gap: .35rem; margin-bottom: .45rem; }
.zoom-btn {
  width: 44px; height: 44px; border-radius: 12px; background: #fffaf0; color: var(--ink);
  border: 2px solid #c8b48a; font-size: 1.25rem; font-weight: 800;
}
.map-loading { text-align: center; padding: 4rem 1rem; font-weight: 700; color: var(--muted); }
.state-path {
  stroke: #fffaf0; stroke-width: 1.2px; cursor: pointer;
  transition: fill .15s; transform-box: fill-box; transform-origin: center;
}
.state-a { fill: var(--state-a); } .state-b { fill: var(--state-b); }
.state-c { fill: var(--state-c); } .state-d { fill: var(--state-d); }
.state-path:hover { fill: var(--state-hover); }
.state-found, .state-found:hover { fill: var(--state-found); cursor: default; }
.state-answer, .state-answer:hover { fill: #2f8f62 !important; stroke: #146c43; stroke-width: 3px; }
.state-wrong { animation: shake .45s; fill: var(--danger) !important; stroke: #6d1020; stroke-width: 2.5px; }
.state-pop { animation: pop .5s; }
.state-hint { animation: hintPulse 1s ease-in-out infinite; fill: var(--candle) !important; }
.state-peek { animation: pop .4s; fill: #e7b3d8 !important; }
@keyframes shake { 0%, 100% { transform: translate(0); } 25% { transform: translate(-3px); } 75% { transform: translate(3px); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes hintPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.2) drop-shadow(0 0 6px var(--gold)); } }
.state-star { text-anchor: middle; dominant-baseline: middle; fill: #a67c2d; font-size: 15px; }
.state-label {
  text-anchor: middle; dominant-baseline: middle; fill: var(--ink);
  paint-order: stroke; stroke: #fffaf0; stroke-width: 3px; font-size: 13px; font-weight: 800;
}
.inset-box { fill: #fffaf0; stroke: #c8b48a; stroke-width: 1.5px; stroke-dasharray: 5 4; }
.inset-hit { fill: transparent; cursor: pointer; }
.inset-caption { font-size: 12px; font-weight: 700; fill: var(--muted); text-anchor: middle; }
.quiz-kicker { color: var(--house); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }
.quiz-word { font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.15; margin: .25rem 0 .15rem; }
.quiz-ask { color: #4d3d2e; font-size: 1.05rem; margin-bottom: .8rem; }
.seq-line { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.seq-q { color: var(--house); }
.choice-grid { display: grid; grid-template-columns: 1fr; gap: .55rem; }
@media (min-width: 720px) { .choice-grid { grid-template-columns: 1fr 1fr; } }
.choice-wrap { min-width: 0; }
.choice-line { display: flex; gap: .4rem; align-items: stretch; }
.choice-line .choice { flex: 1; min-width: 0; }
.info-btn {
  width: 44px; min-width: 44px; border-radius: 12px; border: 2px solid #c8b48a;
  background: #fffaf0; color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 1.05rem;
}
.info-pop {
  margin-top: .4rem; background: #fffaf0; border: 2px solid var(--gold-deep); border-radius: 12px;
  padding: .7rem .8rem; color: var(--ink); text-align: left; box-shadow: 0 8px 18px #0003;
}

}
.choice:hover:not(:disabled) { border-color: var(--house); transform: translateY(-1px); }

.explain-ok { border-color: var(--found); }

.explain-kicker { font-family: var(--font-display); font-weight: 800; margin-bottom: .25rem; }

.shelf-locked svg { filter: grayscale(1) brightness(.6) opacity(.45); }
.shelf-owned { background: #e5f3e4; border: 2px solid var(--found); animation: pop .5s; }
.shelf-name { text-align: center; font-size: .8rem; font-weight: 700; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; background: #140e1ccc;
  display: flex; justify-content: center; align-items: center; padding: 1rem;
}

  display: flex; flex-direction: column; align-items: center; gap: .45rem;
  width: 100%; max-width: 420px; padding: 1.4rem 1.5rem 1.6rem;

}
.reward-banner { color: var(--house); font-family: var(--font-display); font-weight: 800; }

.reward-tagline { color: var(--muted); font-weight: 700; }
.big-btn {
  background: var(--house); color: var(--house-ink); border-radius: 999px; margin-top: .6rem;
  padding: .7rem 1.5rem; font-size: 1.05rem; font-weight: 800; min-height: 48px;
  box-shadow: 0 4px 0 #0004;
}
.big-btn:hover { transform: translateY(-1px); }
button:focus-visible, .topic-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.pills { display: flex; flex-wrap: wrap; gap: .4rem; }

}
.course-head { display: flex; align-items: flex-start; }

.path-wrap { max-width: 440px; margin: 0 auto; }
.path-hero { text-align: center; margin-bottom: .8rem; }

function colourise(ids, neighbours) {
  const classes = ["state-a","state-b","state-c","state-d"], out = new Map();
  ids.forEach(id => {
    const used = new Set((neighbours.get(id) || []).map(n => out.get(n)));
    out.set(id, classes.find(c => !used.has(c)) || classes[0]);
  });
  return out;
}

function buildUS(test) {
  const topo = window.US_STATES_TOPO;
  const known = new Set(test.places.map(p => p[0]));
  const geoms = topo.objects.states.geometries;
  const fc = topojson.feature(topo, topo.objects.states);
  const proj = d3.geoAlbersUsa().fitExtent([[10, 10], [965, 600]], fc);
  const path = d3.geoPath(proj);
  const shapes = [];
  fc.features.forEach(f => {
    const id = String(f.id).padStart(2, "0");
    if (!known.has(id)) return;
    const d = path(f); if (!d) return;
    const [cx, cy] = path.centroid(f);
    shapes.push({ id, d, cx, cy });
  });
  const nb = topojson.neighbors(geoms), neighbours = new Map();
  geoms.forEach((g, i) => neighbours.set(String(g.id).padStart(2, "0"), nb[i].map(j => String(geoms[j].id).padStart(2, "0")).filter(x => known.has(x))));
  return { width: 975, height: 610, shapes, insets: [], neighbours };
}

function buildFR(test) {
  const topo = window.FR_REGIONS_TOPO;
  const geoms = topo.objects.regions.geometries;
  const fc = topojson.feature(topo, topo.objects.regions);
  const W = 975, H = 820, shapes = [], insets = [];
  // Corse sits far southeast of the hexagon. On a phone it was a speck under the
  // zoom controls, so it gets its own box, like the overseas regions.
  const boxed = ["94"].concat(FR_OVERSEAS);
  const metro = fc.features.filter(f => !boxed.includes(f.id));
  const proj = d3.geoConicConformal().parallels([44, 49]).rotate([-3, 0])
    .fitExtent([[210, 8], [W - 8, H - 8]], { type: "FeatureCollection", features: metro });
  const path = d3.geoPath(proj);
  metro.forEach(f => { const [cx, cy] = path.centroid(f); shapes.push({ id: f.id, d: path(f), cx, cy }); });

  const boxW = 200, gap = 8, corseH = 188;
  const overseasH = (H - 16 - gap * (boxed.length - 1) - corseH) / FR_OVERSEAS.length;
  boxed.forEach((id, i) => {
    const f = fc.features.find(x => x.id === id);
    const boxH = id === "94" ? corseH : overseasH;
    const y0 = 8 + (id === "94" ? 0 : corseH + gap + (i - 1) * (overseasH + gap));
    const x0 = 8;
    const p = d3.geoMercator().fitExtent([[x0 + 18, y0 + 12], [x0 + boxW - 18, y0 + boxH - 26]], f);
    const ip = d3.geoPath(p);
    const [cx, cy] = ip.centroid(f);
    shapes.push({ id, d: ip(f), cx, cy });
    insets.push({ id, x: x0, y: y0, w: boxW, h: boxH, caption: id === "94" ? "Island" : "Far" });
  });
  const nb = topojson.neighbors(geoms), neighbours = new Map();
  geoms.forEach((g, i) => neighbours.set(g.id, nb[i].map(j => geoms[j].id)));
  return { width: W, height: H, shapes, insets, neighbours };
}

  fc.features.forEach(f => { f.id = pad(f.id); });
  const W = 975, H = 820, shapes = [];
  const main = fc.features.filter(f => f.id !== "47");
  const proj = d3.geoMercator().fitExtent([[10, 10], [W - 10, H - 10]], { type: "FeatureCollection", features: main });
  const path = d3.geoPath(proj);
  main.forEach(f => { const [cx, cy] = path.centroid(f); shapes.push({ id: f.id, d: path(f), cx, cy }); });
  // Okinawa goes in a box in the empty top-left corner, as on Japanese school maps.
  const box = { id: "47", x: 10, y: 10, w: 250, h: 190 };
  const oki = fc.features.find(f => f.id === "47");
  const op = d3.geoPath(d3.geoMercator().fitExtent([[box.x + 12, box.y + 10], [box.x + box.w - 12, box.y + box.h - 24]], oki));
  const [cx, cy] = op.centroid(oki);

    S.locked = false;
    S.picked = null;
    S.selected = null;
    S.selectedGeo = null;
    S.hintHide = null;

function selectChoice(choice) {

  if (!choice || choice === S.hintHide) return;

function checkAnswer() {
  if (S.locked || S.reward || !S.lesson || S.explore) return;
  if (questionKind() === "map") {
    if (S.selectedGeo == null) return;
    return onPlaceClick(S.selectedGeo);
  }
  if (!S.selected) return;
  onChoice(S.selected);
}
function onChoice(choice) {
  if (questionKind() !== "mcq" || S.locked || S.reward) return;
  if (S.won && !S.lesson) return;
  if (!choice || choice === S.hintHide) return;
  const q = current();
  if (!q) return;
  S.locked = true;
  S.picked = choice;
  const ok = choice === q.answer;
  if (S.practice) {
    if (ok) {
      sfx.correct(); fireConfetti(false);
      if (S.firstTry) { S.missed.delete(q.id); saveMissed(); }
      S.message = (S.firstTry ? `${pick(CHEERS)} Cleared from review.` : `Right on the review.`) + (exampleSentence(q) ? " " + exampleSentence(q) : "");
    } else {
      S.firstTry = false;
      sfx.wrong();
      S.message = `The charm slips. The true match was ${q.answer}.` + (exampleSentence(q) ? " " + exampleSentence(q) : "");
    }
    return render();
  }
  if (ok) {
    const already = S.found.has(q.id);
    if (!already) {
      S.found.add(q.id);
      const gained = 100 + Math.min(S.streak * 10, 50);
      S.score += gained; S.streak++;
      if (S.lesson) S.lesson.xp += gained;
      if (S.score > S.best) { S.best = S.score; store.set(`wqa-${test.key}-best`, S.best); }
      S.missed.delete(q.id);
      S.queue = S.queue.filter(x => x !== q.id);
      if (!S.queue.length) S.won = true;
      noteRelic();
    } else if (S.lesson && S.lesson.replay) {
      S.score += 20;
      S.lesson.xp += 20;
    }
    if (S.lesson) S.lesson.correct++;
    S.message = S.streak >= 3 ? `${pick(CHEERS)} ${S.streak} in a row — house points flare.` : pick(CHEERS);
    if (S.streak % 5 === 0) sfx.streak(); else sfx.correct();
    fireConfetti(false);
  } else {
    S.streak = 0;
    if (!S.lesson || !S.lesson.replay) { S.missed.add(q.id); saveMissed(); }
    sfx.wrong();
    S.message = `The spell fizzles. ${q.answer} was the true match.` + (exampleSentence(q) ? " " + exampleSentence(q) : "");
  }
  render();
}
function advanceAfterLock() {
  S.locked = false;
  S.picked = null;
  S.selected = null;
  S.selectedGeo = null;
  S.choiceFor = null;
  S.hintHide = null;
  S.pendingReward = null;
  if (S.lesson) {
    S.lesson.answered++;
    S.lesson.queue.shift();
    if (!S.lesson.queue.length) return finishLesson();
    S.message = "Onward, apprentice.";
    return render();
  }
  if (S.practice) {
    S.practiceQueue = S.practiceQueue.slice(1);
    if (!S.practiceQueue.length) {
      S.practice = false;
      S.message = "Review complete. Back to the quest.";
      return render();
    }
    S.message = "Another one from the review pile.";
    return render();
  }
  S.queue = S.queue.slice(1);
  if (!S.queue.length) {
    S.won = true; S.party = true; sfx.levelUp(); fireConfetti(true);
    return render();
  }
  S.message = "Onward, apprentice.";
  render();
}
function continueQuestion() {
  if (!S.locked || S.reward) return;
  if (S.lesson) return advanceAfterLock();
  if (S.pendingReward) {
    const reward = S.pendingReward;
    S.pendingReward = null;
    S.reward = reward;
    S.party = true;
    if (!S.unlocked.includes(reward.level)) { S.unlocked.push(reward.level); saveUnlocked(); }
    sfx.levelUp(); fireConfetti(true);
    S.message = pick(LEVEL_MSGS);
    return render();
  }
  advanceAfterLock();
}

let zoomT = null, zoomBehaviour = null;
function attachZoom() {
  const svg = d3.select("#map svg"), layer = svg.select(".zoom-layer");
  const { width, height } = mapData;
  zoomBehaviour = d3.zoom().scaleExtent([1, 8]).translateExtent([[0, 0], [width, height]])
    .filter(e => {
      if (e.type === "wheel") return e.ctrlKey;
      if (e.type.startsWith("touch")) return e.touches.length > 1 || (zoomT && zoomT.k > 1);
      if (e.type === "mousedown") return !e.button && zoomT && zoomT.k > 1;
      return !e.button;
    })
    .on("zoom", e => {
      zoomT = e.transform;
      layer.attr("transform", zoomT);
      svg.classed("zoomed", zoomT.k > 1);
    });
  svg.call(zoomBehaviour).on("dblclick.zoom", null);
  svg.call(zoomBehaviour.transform, zoomT || d3.zoomIdentity);
}

function localDay(d) {
  const x = d || new Date();
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}
function bumpDayStreak() {
  const today = localDay();
  const prev = store.get("wqa-day-streak", { n: 0, day: "" });
  if (prev.day === today) return prev.n || 0;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const n = prev.day === localDay(y) ? (prev.n || 0) + 1 : 1;
  store.set("wqa-day-streak", { n, day: today });
  return n;
}
function totalXp() {
  let n = store.get("wqa-bonus-xp", 0) || 0;
  Object.keys(TESTS).forEach(k => {
    if (k === "mixed") return;
    if (test && k === test.key && S && typeof S.score === "number") n += S.score;
    else n += (store.get(`wqa-${k}-session`, null) || {}).score || 0;
  });
  return n;
}
function typeSession(key) {
  if (test && test.key === key && S && S.found) return { found: S.found, score: S.score || 0 };
  const saved = store.get(`wqa-${key}-session`, null);
  return { found: new Set((saved && saved.found) || []), score: (saved && saved.score) || 0 };
}
function typeLessonIds(key, lesson) {
  return catalogFor(key).filter(p => p.lesson === lesson).map(p => p.id);
}
function conjKeptLessons() {
  const rec = store.get("wqa-conj-lesson-kept", null);

}
function slotDone(type, lessonNumber, ids, foundSet) {

function updatePills() {

function chunkIds(ids, n) {
  const out = [];
  for (let i = 0; i < ids.length; i += n) out.push(ids.slice(i, i + n));
  return out;
}
function indexLessons(units) {
  let n = 0;
  return units.filter(u => u.ids && u.ids.length).map(u => ({
    title: u.title,

function syncLessonChrome() {

  document.body.classList.toggle("feedback-open", !!(lesson && S.locked && !S.practice));

  }

      const scroller = fb.querySelector(".feedback-scroll");

  if (again) again.textContent = L("continue");
  updatePills();

  $("quitAsk").hidden = false;
});
$("quitStay").addEventListener("click", () => { $("quitAsk").hidden = true; });
$("quitGo").addEventListener("click", quitLesson);
$("checkBtn").addEventListener("click", checkAnswer);
$("continueBtn").addEventListener("click", continueQuestion);
$("summaryContinue").addEventListener("click", () => {
  sfx.click();
  view = "learn";
  $("summary").hidden = true;
  if (pathHome) showAcademy();
  else showTab("learn");
});
$("menuItems").addEventListener("click", onTestClick);
$("backBtn").addEventListener("click", () => switchTo("home"));
$("zoomIn").addEventListener("click", () => zoomBy(1.6));
$("zoomOut").addEventListener("click", () => zoomBy(1 / 1.6));
$("zoomReset").addEventListener("click", () => { if (zoomBehaviour) d3.select("#map svg").transition().duration(250).call(zoomBehaviour.transform, d3.zoomIdentity); });
function closeMenu() { $("menu").hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); }
$("menuBtn").addEventListener("click", e => {
  e.stopPropagation();
  $("menuItems").innerHTML = quizMenu(test && test.key);
  const open = $("menu").hidden;
  $("menu").hidden = !open;
  $("menuBtn").setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => { if (!e.target.closest(".activity-menu-wrap")) closeMenu(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); if (S.reward) closeReward(); return; }
  if (S.reward) return;
  if (questionKind() === "mcq" && !S.locked && /^[1-4]$/.test(e.key)) {
    const choice = S.choiceOrder && S.choiceOrder[Number(e.key) - 1];
    if (choice && choice !== S.hintHide) selectChoice(choice);
    return;
  }
  if (e.key === "Enter" && view === "lesson") {
    if (S.locked) continueQuestion();
    else checkAnswer();
  }
});
window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (!k || k === "home" || k === "mixed") {
    if (!pathHome || (view !== "learn" && view !== "lesson" && view !== "summary")) showAcademy();
    return;
  }
  if (TESTS[k] && (!test || k !== test.key || pathHome || (view !== "learn" && view !== "lesson"))) selectTest(k);
});

applyHouse(store.get("wqa-house", "emberwyck"));
refreshBests();
migrateMixed();
if (window.applyConjMigration) applyConjMigration(store, window.CONJ_FR || []);
const boot = location.hash.slice(1);
if (TESTS[boot] && boot !== "mixed") selectTest(boot);
else showAcademy();
</script>
</body>
</html>
